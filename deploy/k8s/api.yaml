apiVersion: v1
kind: Secret
metadata:
  name: fda-api
type: Opaque
stringData:
  # Replace with a generated token; never commit the rendered manifest.
  token: "CHANGE-ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fda-api
  labels:
    app: fda-api
spec:
  # SQLite needs one writer; scale vertically or shard by tenant for more.
  replicas: 1
  selector:
    matchLabels:
      app: fda-api
  template:
    metadata:
      labels:
        app: fda-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: fda:latest
          command: ["fda", "api", "serve", "--host", "0.0.0.0", "--port", "8080"]
          env:
            - name: FDA_STATE
              value: /var/lib/fda/state.db
            - name: FDA_AGENTS
              value: /var/lib/fda/agents
            - name: FDA_AUDIT
              value: /var/lib/fda/audit.jsonl
            - name: FDA_APPROVAL_MODE
              value: external
            - name: FDA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fda-api
                  key: token
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
          volumeMounts:
            - name: state
              mountPath: /var/lib/fda
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: fda-state
---
apiVersion: v1
kind: Service
metadata:
  name: fda-api
spec:
  selector:
    app: fda-api
  ports:
    - port: 8080
      targetPort: 8080
