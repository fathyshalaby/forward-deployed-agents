[metadata]
name = forward-deployed-agents
version = 0.6.0
description = Run governed agents inside a customer boundary with user-owned connectors and installable agent bundles.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Fathy Shalaby

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    fda = fda.cli:main
